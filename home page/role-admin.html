<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOA Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page-container">
        <header class="page-topbar">
            <span class="modal-badge">HOA Admin Portal</span>
            <a href="index.html" class="btn-secondary">← Back to Home</a>
        </header>
        <main class="dashboard-box">
            <div class="dash-stats">
                <div class="stat-card">
                    <h4>14</h4><span>Total Reports</span>
                </div>
                <div class="stat-card">
                    <h4>3</h4><span>Unassigned</span>
                </div>
                <div class="stat-card">
                    <h4>89%</h4><span>Resolution Rate</span>
                </div>
            </div>
            <h2>Subdivision Oversight & Evidence Queue</h2>
            <table class="dash-table">
                <thead>
                    <tr>
                        <th>Reporter</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Maria S. (Blk 2)</td>
                        <td>Drainage clog near basketball court</td>
                        <td><button class="action-btn-sm" onclick="alert('Assigned contractor.')">Assign</button></td>
                    </tr>
                    <tr>
                        <td>Juan D. (Blk 6)</td>
                        <td>Uncollected bulk tree branches</td>
                        <td><button class="action-btn-sm" onclick="alert('Assigned collection team.')">Assign</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    <script src="main.js"></script>
</body>

</html>
