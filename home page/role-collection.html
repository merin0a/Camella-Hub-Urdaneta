<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Point Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page-container">
        <header class="page-topbar">
            <span class="modal-badge">Collection Point Portal</span>
            <a href="index.html" class="btn-secondary">← Back to Home</a>
        </header>
        <main class="dashboard-box">
            <div class="dash-stats">
                <div class="stat-card">
                    <h4>Zone 1</h4><span>Current Route</span>
                </div>
                <div class="stat-card">
                    <h4>Done</h4><span>Morning Pickup</span>
                </div>
                <div class="stat-card">
                    <h4>100%</h4><span>Bins Cleared</span>
                </div>
            </div>
            <h2>Trash Collection Logs</h2>
            <table class="dash-table">
                <thead>
                    <tr>
                        <th>Zone / Area</th>
                        <th>Scheduled Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Phase 1 (Blocks 1-5)</td>
                        <td>06:00 AM</td>
                        <td><span class="status-pill resolved">Completed</span></td>
                    </tr>
                    <tr>
                        <td>Phase 2 (Blocks 6-10)</td>
                        <td>08:00 AM</td>
                        <td><span class="status-pill resolved">Completed</span></td>
                    </tr>
                </tbody>
            </table>
            <button class="action-btn-sm" style="margin-top: 16px;" onclick="alert('Run marked complete!')">Mark
                Afternoon Run Complete</button>
        </main>
    </div>
    <script src="main.js"></script>
</body>

</html>
